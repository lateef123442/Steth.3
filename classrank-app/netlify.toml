# Builds the web version of Steth (the one iPhone users open in Safari and add to their Home Screen).
# On Netlify: Add new site -> Import from GitHub -> this repository, set "Base directory" to classrank-app.
# Then add EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY under Site configuration -> Environment variables.
[build]
  command = "npm ci --legacy-peer-deps && npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  CI = "1"
  EXPO_NO_TELEMETRY = "1"
  # These two are Supabase's PUBLIC values and are meant to be inside the website code. Without this,
  # Netlify's secret scan mistakes them for leaked secrets and stops the build.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_SUPABASE_ANON_KEY,EXPO_PUBLIC_SUPABASE_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

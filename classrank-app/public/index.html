<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app use the whole iPhone screen; the app keeps its content clear of the notch and home bar itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- "Add to Home Screen" on iPhone: opens full screen like an app, with its own icon and name. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Steth" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; -webkit-text-size-adjust: 100%; overscroll-behavior: none; background: #10162C; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Stops iPhone Safari zooming in when a text box is tapped. */
      input, textarea, select { font-size: 16px; }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
